<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade Journal - Log Trade</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#f8f9fa] border-r border-gray-200 flex flex-col">
        <div class="h-16 flex items-center px-6 mt-4">
            <svg class="w-8 h-8 text-slate-800" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/>
            </svg>
            <span class="ml-3 font-bold text-slate-800 text-lg">Trade Vault</span>
        </div>

        <nav class="flex-1 mt-6 px-4 space-y-2">
            <!-- Dashboard Link (Updated to go back to index.html) -->
            <a href="index.html" class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <!-- Log Trade Link (Active State) -->
            <a href="log_trade.html" class="flex items-center px-4 py-3 bg-gray-200 text-slate-800 rounded-lg font-medium">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                Log Trade
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Top Header -->
        <header class="h-16 bg-[#f0f2f5] flex items-center justify-between px-8">
            <h1 class="text-xl font-semibold text-slate-800">Log New Trade</h1>
            <div class="flex items-center space-x-6">
                <div class="w-8 h-8 rounded-full bg-gray-300 overflow-hidden border border-gray-400">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <!-- Form Content -->
        <div class="flex-1 overflow-y-auto px-8 pb-10">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 max-w-3xl">
                
                <form id="tradeForm" class="space-y-6">
                    
                    <!-- Basic Details Row -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Instrument / Pair</label>
                            <input type="text" value="XAUUSD" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                            <input type="date" value="2026-08-07" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
                            <select class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500">
                                <option>Long (Buy)</option>
                                <option>Short (Sell)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Net P/L ($)</label>
                            <input type="number" placeholder="e.g. 50.00" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500">
                        </div>
                    </div>

                    <!-- Photo Upload -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Upload Chart Screenshot</label>
                        <input type="file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
                    </div>

                    <!-- Strategy / Code Section -->
                    <div class="pt-4 border-t border-gray-100">
                        <label class="block text-sm font-bold text-slate-800 mb-1">
                            Trade Strategy & Code Logic
                        </label>
                        <p class="text-xs text-gray-500 italic mb-3">
                            * Note: Agar aap comfortable hain, tabhi apni strategy share karein. Yeh completely optional hai.
                        </p>
                        <!-- Dark textarea simulating a code editor -->
                        <textarea 
                            class="w-full px-4 py-3 bg-[#1e293b] text-green-400 font-mono text-sm rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-slate-400" 
                            rows="6" 
                            placeholder="# Paste your Python/Pine Script or SMC Logic here...&#10;&#10;// Example:&#10;if (liquidity_swept and choch_formed) {&#10;    enter_trade();&#10;}"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="button" onclick="openModal()" class="w-full bg-slate-800 text-white font-medium py-3 rounded-md hover:bg-slate-700 transition-colors">
                            Submit Trade Entry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- The Discipline Checklist Modal (Hidden by default) -->
    <div id="ruleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 transform scale-95 transition-transform duration-300">
            <h2 class="text-xl font-bold text-slate-800 mb-2">Discipline Check 🛑</h2>
            <p class="text-sm text-gray-500 mb-6">Aaj aapne inme se kaun kaun se rules follow kiye? Sach sach batana.</p>
            
            <div class="space-y-3">
                <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-md border border-gray-100 cursor-pointer">
                    <input type="checkbox" class="w-5 h-5 text-slate-800 rounded focus:ring-slate-500">
                    <span class="text-slate-700 font-medium">Liquidity sweep ka wait kiya?</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-md border border-gray-100 cursor-pointer">
                    <input type="checkbox" class="w-5 h-5 text-slate-800 rounded focus:ring-slate-500">
                    <span class="text-slate-700 font-medium">Risk 1% se kam tha?</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-md border border-gray-100 cursor-pointer">
                    <input type="checkbox" class="w-5 h-5 text-slate-800 rounded focus:ring-slate-500">
                    <span class="text-slate-700 font-medium">Sirf apne active session me trade liya?</span>
                </label>
                <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-md border border-gray-100 cursor-pointer">
                    <input type="checkbox" class="w-5 h-5 text-slate-800 rounded focus:ring-slate-500">
                    <span class="text-slate-700 font-medium">No FOMO (Dar ke entry nahi li)?</span>
                </label>
            </div>

            <div class="mt-8 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-600 font-medium hover:bg-gray-100 rounded-md">Cancel</button>
                <a href="index.html" class="px-6 py-2 bg-slate-800 text-white font-medium rounded-md hover:bg-slate-700">Save to Vault</a>
            </div>
        </div>
    </div>

    <!-- JavaScript for Modal -->
    <script>
        const modal = document.getElementById('ruleModal');

        function openModal() {
            modal.classList.remove('hidden');
            // Slight delay for animation effect
            setTimeout(() => {
                modal.children[0].classList.remove('scale-95');
                modal.children[0].classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.children[0].classList.remove('scale-100');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }
    </script>

</body>
                                                                                                                                                                                                 </html>
